<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}House Price Prediction{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">HP</span> House Price Predictor</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <nav class="nav-links" id="nav-links">
        <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Predict</a>
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
        <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">History</a>
      </nav>
    </div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="footer container">
    <p>Predictions are statistical estimates for King County, WA homes sold in 2014&ndash;2015. They are not
       guaranteed property valuations and should not be used for financial decisions.</p>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
